name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  renovate-config:
    name: Renovate preset is valid
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate renovate-config.json
        run: npx --yes --package renovate@44.132.5 -- renovate-config-validator --strict --no-global renovate-config.json
