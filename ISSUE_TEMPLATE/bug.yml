name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of Drive Horizon, or the commit you built.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >
        For the app, the game version, the interface (Panorama or Mosaic)
        and the log. For the website, the page address, the browser and
        the screen width.
      render: text
